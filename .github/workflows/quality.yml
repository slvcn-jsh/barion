name: quality
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

jobs:
  fast-ci:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22.13.1', cache: npm }
      - run: pip install -r services/card_benchmark/requirements.txt
      - run: npm ci
      - run: python -m pytest services/card_evaluation/tests services/card_benchmark/tests services/ai_gateway/tests -q
      - run: npm run typecheck
      - run: npm test -- --runInBand
      - run: python -m compileall -q services
      - run: git diff --check
  periodic-quality:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: quality-benchmark
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r services/card_benchmark/requirements.txt
      - run: python -m services.card_benchmark --dry-run
      - run: echo 'Live generation, authority verification, and SOL evaluation require protected environment secrets and explicit operator approval.'
